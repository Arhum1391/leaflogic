# R8/D8 + C2 compiler use a lot of *native* RAM. On ~16 GB machines a large -Xmx
# can block native allocations (see hs_err: Chunk::new / CompressedOops). Keep
# heap smaller and limit workers so the daemon is less likely to die mid-build.
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=128m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=1

# These don't increase memory; they reuse work across builds. Big speedup for
# repeat runs (after first cold build, incremental rebuilds drop to seconds).
org.gradle.daemon=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

android.useAndroidX=true
# Skip Jetifier scan (saves several seconds per configure) - safe because no
# legacy support libraries are in this dependency graph.
android.enableJetifier=false
