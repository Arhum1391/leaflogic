# R8/D8 + C2 compiler use a lot of *native* RAM. On ~16 GB machines a large -Xmx
# can block native allocations (see hs_err: Chunk::new / CompressedOops). Keep
# heap smaller and limit workers so the daemon is less likely to die mid-build.
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=128m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=1

# Daemon + build cache reuse work across runs without using more memory. The
# configuration cache is intentionally OFF: the Flutter Gradle plugin's
# DebugMinSdkCheck task captures non-serializable Kotlin lazy delegates, which
# breaks `org.gradle.configuration-cache=true` (Gradle aborts the build with
# "Configuration cache state could not be cached"). Re-enable only after
# upgrading Flutter to a version that fixes this.
org.gradle.daemon=true
org.gradle.caching=true

android.useAndroidX=true
# Skip Jetifier scan (saves several seconds per configure) - safe because no
# legacy support libraries are in this dependency graph.
android.enableJetifier=false
